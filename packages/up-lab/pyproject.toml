[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "up-lab"
version = "0.1.0"
description = "Benchmarking experiments for Unified Planning engines."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "up-lab-worker",
    "unified-planning>=1.2",
    "pydantic>=2",
    "pyyaml",
    "typer",
    "pluggy",
    "submitit",
    "pyoxigraph>=0.5",
    "pandas",
    "jinja2",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
notebook = ["marimo"]
serve = ["oxigraph"]

[project.scripts]
uplab = "up_lab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/up_lab"]
