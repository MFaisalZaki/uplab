[project]
name = "up-lab-workspace"
version = "0"
requires-python = ">=3.10"
dependencies = ["up-lab[notebook,serve]", "up-lab-worker"]

[dependency-groups]
dev = ["pytest>=8", "up-pyperplan", "black", "mypy"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
up-lab = { workspace = true }
up-lab-worker = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
