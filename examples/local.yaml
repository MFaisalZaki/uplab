# Local example: pyperplan on two domains with two problems each, run by a
# process pool on this machine.
#
#   uplab all examples/local.yaml
#
# Results go to examples/experiments/demo-local.
name: demo-local
benchmarks:
  - name: tiny
    source: benchmarks            # local path, relative to this file
planners:
  - name: pyperplan
    source: [up-pyperplan]
variants:
  - name: pyperplan
    planner: pyperplan
    engine: pyperplan             # shorthand for a one-step pipeline
requests:
  - name: sat
    mode: oneshot
limits: {time: 60, memory_mb: 2048, cores: 1}
executor:
  kind: local
  workers: 2
